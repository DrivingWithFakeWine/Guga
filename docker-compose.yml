services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guga}
      POSTGRES_USER: ${POSTGRES_USER:-guga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guga}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guga -d guga"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-guga}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guga}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-guga}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 字节）}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
