version: 2.1

jobs:
  backend:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - setup_remote_docker
      - checkout
      - restore_cache:
          key: m2-{{ checksum "pom.xml" }}
      - run:
          name: 后端构建与测试（单测 + Testcontainers 集成测试）
          command: ./mvnw -B -ntp verify
      - save_cache:
          key: m2-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

  frontend:
    docker:
      - image: node:24
    steps:
      - checkout
      - restore_cache:
          key: npm-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: 前端测试与构建
          command: npm ci && npm run test -- --run && npm run build
          working_directory: frontend
      - save_cache:
          key: npm-{{ checksum "frontend/package-lock.json" }}
          paths:
            - ~/.npm

  docker:
    machine: true
    steps:
      - checkout
      - run:
          name: Docker Compose 构建校验（一键部署的两份镜像）
          command: |
            export JWT_SECRET=ci-dummy-secret-0123456789abcdef-0123456789abcdef
            docker compose build
            docker compose config -q

workflows:
  verify:
    jobs:
      - backend
      - frontend
  verify-docker:
    jobs:
      - docker:
          filters:
            branches:
              only: main
